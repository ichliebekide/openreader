# Builds the Linux packages and publishes a GitHub release when a version tag
# (v0.1.0, v0.1.1, ...) is pushed. The release text is the matching section of
# CHANGELOG.md; OpenReader's update check reads the latest release.
# Actions are pinned to commit hashes so a moved tag cannot change what runs
# here; Dependabot (.github/dependabot.yml) proposes updates.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the app version
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version" >&2
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libasound2-dev libssl-dev libxdo-dev \
            cmake clang pkg-config patchelf file

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri -> target
            . -> target

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: trunk,tauri-cli

      - name: Tests
        run: |
          cargo test
          cd src-tauri && cargo test --workspace

      - name: Build .deb and AppImage
        run: cargo tauri build --bundles deb,appimage

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: OpenReader ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
