# Trunk builds the Leptos UI (Cargo.toml in this directory) into dist/.
# Tauri runs `trunk serve` / `trunk build --release` (src-tauri/tauri.conf.json).
[build]
target = "index.html"
dist = "dist"

[watch]
# Only the UI sources: anything else in the repository (logs, docs, the Tauri
# shell, which `cargo tauri dev` watches itself) must not rebuild and reload
# the running windows, or the overlay bubble vanishes right after it appears.
watch = ["./src", "./styles", "./index.html", "./Cargo.toml", "./src-tauri/api-types/src"]

[serve]
addresses = ["127.0.0.1"]
port = 1420
open = false
