[package]
name = "openreader-backend"
version = "0.1.0"
description = "Native Rust backend for OpenReader (REST/WebSocket API, TTS, selection, documents)."
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "openreader_backend"
path = "src/lib.rs"

[[bin]]
name = "openreader-backend"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
cpal = "0.15"
futures = "0.3"
hound = "3.5"
htmlize = { version = "1", features = ["unescape"] }
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif"] }
libc = "0.2"
pdf-extract = "0.9"
quick-xml = "0.37"
rand = "0.8"
regex = "1"
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "11", features = ["chrono-impl", "no-serde-warnings"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
