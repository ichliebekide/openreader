[package]
name = "openreader-backend"
version = "0.1.1"
description = "Native Rust backend for OpenReader (REST/WebSocket API, TTS, selection, documents)."
license = "Apache-2.0"
edition = "2021"
rust-version = "1.82"

[lib]
name = "openreader_backend"
path = "src/lib.rs"

[[bin]]
name = "openreader-backend"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
cpal = "0.15"
futures = "0.3"
hound = "3.5"
htmlize = { version = "1", features = ["unescape"] }
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif"] }
libc = "0.2"
openreader-api = { path = "../api-types" }
ocrs = { version = "0.13", default-features = false, features = ["rten"] }
os_pipe = "1"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "download-binaries", "tls-rustls", "tracing"] }
pdf-extract = "0.9"
quick-xml = "0.37"
rand = "0.8"
regex = "1"
rten = { version = "0.26", default-features = false, features = ["rten_format"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
# 0.9.5: fix for a watcher panic on late offer events from KWin's XWayland bridge.
wl-clipboard-rs = "0.9.5"
wayland-client = "0.31"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full", "test-util"] }
http-body-util = "0.1"

[build-dependencies]
cmake = "0.1"
flate2 = "1"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
