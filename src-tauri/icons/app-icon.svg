<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34322f"/>
      <stop offset="1" stop-color="#1c1b1a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b45c"/>
      <stop offset="1" stop-color="#d98e2b"/>
    </linearGradient>
  </defs>

  <!-- Squircle tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64.5" y="64.5" width="895" height="895" rx="207.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <!-- Text lines -->
  <g fill="#ece7df">
    <rect x="200" y="300" width="340" height="56" rx="28" opacity="0.9"/>
    <rect x="200" y="484" width="96" height="56" rx="28" opacity="0.9"/>
    <rect x="200" y="668" width="280" height="56" rx="28" opacity="0.9"/>
  </g>

  <!-- The word being read: highlighter mark with underline -->
  <rect x="326" y="462" width="252" height="100" rx="22" fill="#e3a44f" fill-opacity="0.42"/>
  <rect x="348" y="484" width="208" height="56" rx="28" fill="#ece7df"/>
  <rect x="326" y="574" width="252" height="24" rx="12" fill="url(#amber)"/>

  <!-- Sound waves -->
  <g fill="none" stroke="url(#amber)" stroke-linecap="round" stroke-width="44">
    <path d="M 668 412 A 120 120 0 0 1 668 612"/>
    <path d="M 742 330 A 228 228 0 0 1 742 694"/>
  </g>
</svg>
