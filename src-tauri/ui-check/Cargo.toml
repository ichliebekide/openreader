[package]
name = "openreader-ui-check"
version = "0.1.2"
description = "Headless UI check and preview server for the OpenReader Leptos UI (silent fixture backend, no desktop integration)."
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"
publish = false

[[bin]]
name = "openreader-ui-check"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
headless_chrome = "1"
openreader-api = { path = "../api-types" }
openreader-backend = { path = "../backend" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
