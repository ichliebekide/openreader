[project]
name = "openreader-backend"
version = "0.1.0"
description = "Local FastAPI services for OpenReader."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "beautifulsoup4>=4.12",
  "dbus-next>=0.2",
  "ebooklib>=0.18",
  "edge-tts>=7.2.8,<8",
  "fastapi>=0.115",
  "numpy>=2.0",
  "pillow>=10.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pypdf>=5.0",
  "pytesseract>=0.3",
  "python-multipart>=0.0.9",
  "sounddevice>=0.5",
  "soundfile>=0.12",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
qwen = [
  "qwen-tts>=0.1.1"
]
dev = [
  "ruff>=0.6",
  "pytest>=8.3",
  "httpx>=0.27"
]
piper = [
  "huggingface-hub>=0.34,<1.0",
  "piper-tts>=1.4"
]

[project.scripts]
openreader-backend = "openreader_backend.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
