# OpenReader UI: Leptos (client-side rendering), built to WebAssembly with Trunk
# and loaded by the Tauri WebView (main window + transparent overlay window).
#
#   trunk serve      dev server on http://127.0.0.1:1420 (Tauri `devUrl`)
#   trunk build      writes dist/ (Tauri `frontendDist`)
#   cargo test       runs the UI logic tests natively
#
# A standalone workspace on purpose: the wasm build has its own profile and
# lock file and never pulls in the native backend/Tauri crates.
[package]
name = "openreader-ui"
version = "0.1.0"
description = "Leptos user interface of OpenReader."
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace]

[dependencies]
console_error_panic_hook = "0.1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
openreader-api = { path = "src-tauri/api-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "FormData",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Storage",
  "Url",
  "UrlSearchParams",
  "Window",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
